[package]
name = "eco"
version = "0.2.0"
edition = "2021"
description = "Private CLI for Ecology DDD orchestration (Rust port of the Node implementation)"
license = "UNLICENSED"
default-run = "eco"

[[bin]]
name = "eco"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"
libc = "0.2"
crossterm = "0.28"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }

# Windows uses the OS-native TLS (SChannel) so no ring/rustls C cross-build is
# needed; macOS/Linux use rustls. rustls pulls `ring`, which does not
# cross-compile to x86_64-pc-windows-gnu via zigbuild.
[target.'cfg(target_os = "windows")'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
lto = true
strip = true
